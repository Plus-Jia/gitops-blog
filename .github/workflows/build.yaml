name: Build Docker Image

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install Kustomize
        run: |
          curl -sLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v6.11.0/kustomize_v6.11.0_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Clone manifests repo
        run: |
          git clone https://x-access-token:${{ secrets.PAT_B }}@github.com/plus-jia/gitops-blog-manifests.git

      - name: Update image tag using Kustomize
        run: |
          cd gitops-blog-manifests/overlays/dev
          kustomize edit set image ghcr.io/plus-jia/gitops-blog=ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Commit and push changes to repo B
        run: |
          cd gitops-blog-manifests
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add overlays/dev/kustomization.yaml
          git commit -m "Update image to ${{ github.sha }}" || echo "No changes to commit"
          git push