name: Build Docker Image

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1️⃣ Checkout 仓库 A
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2️⃣ 设置镜像名小写
      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 3️⃣ 登录 GHCR
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4️⃣ 构建并推镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 5️⃣ 安装 Kustomize（固定版本）
      - name: Install Kustomize
        run: |
          KUSTOMIZE_VERSION=v5.7.1
          curl -L https://github.com/kubernetes-sigs/kustomize/releases/download/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz -o kustomize.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
          kustomize version

      # 6️⃣ Clone 仓库 B
      - name: Clone manifests repo
        run: |
          git clone https://x-access-token:${{ secrets.PAT_B }}@github.com/plus-jia/gitops-blog-manifests.git

      # 7️⃣ 使用 Kustomize 更新 overlay 镜像 tag
      - name: Update image tag using Kustomize
        run: |
          cd gitops-blog-manifests/overlays/dev
          kustomize edit set image ghcr.io/plus-jia/gitops-blog=ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 8️⃣ Commit 并 push 改动到仓库 B
      - name: Commit and push changes to repo B
        run: |
          cd gitops-blog-manifests
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add overlays/dev/kustomization.yaml
          git commit -m "Update image to ${{ github.sha }}" || echo "No changes to commit"
          git push